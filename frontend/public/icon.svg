<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- night sky -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#172342"/>
    </linearGradient>
    <!-- warm light behind the coin -->
    <radialGradient id="halo" cx="0.5" cy="0.46" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <!-- gold coin -->
    <linearGradient id="gold" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#b7791f"/>
    </linearGradient>
    <!-- emerald horizon -->
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="0.35" stop-color="#10b981"/>
      <stop offset="1" stop-color="#064e3b"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#halo)"/>

  <!-- the rising coin: a new month begins -->
  <circle cx="256" cy="232" r="104" fill="url(#gold)"/>
  <circle cx="256" cy="232" r="76" fill="none" stroke="#92600f" stroke-opacity="0.35" stroke-width="7"/>
  <circle cx="256" cy="232" r="104" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>

  <!-- faint outer horizon line for depth -->
  <path d="M -10 392 C 120 218 392 218 522 392" fill="none" stroke="#34d399" stroke-opacity="0.3" stroke-width="4"/>

  <!-- the horizon: emerald hill in front of the coin -->
  <path d="M -10 420 C 120 250 392 250 522 420 L 522 522 L -10 522 Z" fill="url(#hill)"/>
</svg>
