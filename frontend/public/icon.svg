<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- deep ink background with a soft light from the top-left -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16213a"/>
      <stop offset="1" stop-color="#080c16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <!-- the S: light mint at the top, deep emerald at the bottom -->
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bbf7d0"/>
      <stop offset="0.45" stop-color="#34d399"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#d4a017"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- the S: one continuous stroke, the month's curve -->
  <path
    d="M 338 134 C 318 108 288 98 252 98 C 192 98 152 130 152 178 C 152 226 198 242 256 256 C 314 270 360 286 360 336 C 360 384 320 414 260 414 C 212 414 172 396 150 360"
    fill="none" stroke="url(#s)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the single gold point: "end of the month" -->
  <circle cx="390" cy="146" r="24" fill="#0b1120"/>
  <circle cx="390" cy="146" r="18" fill="url(#gold)"/>
</svg>
