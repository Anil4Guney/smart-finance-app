services:
  backend:
    build: ./backend
    container_name: smart_finance_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app # Kodda yaptığın değişiklikler anında yansısın diye
    env_file:
      - ./backend/.env # backend/.env.example dosyasını kopyalayıp doldur
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  frontend:
    build: ./frontend
    container_name: smart_finance_frontend
    ports:
      - "3000:3000"
    environment:
      # Tarayıcı backend'e bu adresten ulaşır
      - NUXT_PUBLIC_API_BASE=http://localhost:8000
    volumes:
      - ./frontend:/app # Canlı yenileme (Hot Reload) için
      - /app/node_modules # Kendi içindeki node_modules'u koruması için
    depends_on:
      - backend # Önce backend'in çalışmasını bekler
